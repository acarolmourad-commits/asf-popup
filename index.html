<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Pop-up — Cronômetro de treino de pop-up | ASF</title><meta name="description" content="Treine o pop-up em casa com séries guiadas, cronômetro e contagem por voz. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-popup/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d);text-align:center}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:36px 20px 26px}.wrap{max-width:480px;margin:0 auto;padding:28px 16px 60px}.timer{font-size:88px;font-weight:800;color:var(--p);font-variant-numeric:tabular-nums}.fase{font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--u)}button{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;border:0;padding:14px 30px;border-radius:999px;font-weight:800;font-size:16px;cursor:pointer;margin:6px}.ghost{background:#fff;color:var(--p);border:2px solid var(--p)}.muted{color:var(--g);font-size:12.5px;margin-top:14px}footer{font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-popup/">⏱️ Pop-up</a><a href="https://acarolmourad-commits.github.io/asf-treino/">🏋️ Treino</a><a href="https://acarolmourad-commits.github.io/asf-manobras/">⚡ Manobras</a><a href="https://acarolmourad-commits.github.io/asf-yoga/">🧘‍♀️ Yoga</a></nav><header><h1>⏱️ Treino de pop-up</h1><p>Séries guiadas: 10 pop-ups, 30s de descanso, 3 rodadas.</p></header><main class="wrap"><div class="fase" id="fase">Pronta?</div><div class="timer" id="t">00</div><div class="muted" id="rep">Pop-ups: 0 · Rodada: 0/3</div><button onclick="start()">Começar ▶️</button><button class="ghost" onclick="reset()">Reiniciar</button><p class="muted">A cada bipe, faça 1 pop-up completo. Voz ativada se o navegador permitir. Combine com a semana do <a href="https://acarolmourad-commits.github.io/asf-treino/" style="color:var(--p)">ASF Treino</a>.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>let tm,fase=0,rep=0,rod=0;function fala(s){try{speechSynthesis.speak(new SpeechSynthesisUtterance(s));}catch(e){}}function att(){document.getElementById('rep').textContent='Pop-ups: '+rep+' · Rodada: '+rod+'/3';}function tick(s,nome,prox){const t=document.getElementById('t');document.getElementById('fase').textContent=nome;let n=s;t.textContent=String(n).padStart(2,'0');clearInterval(tm);tm=setInterval(()=>{n--;t.textContent=String(Math.max(0,n)).padStart(2,'0');if(n<=3&&n>0){try{new AudioContext().resume();}catch(e){}}if(n<=0){clearInterval(tm);prox();}},1000);}function start(){rod=1;rep=0;att();serie();}function serie(){if(rod>3){document.getElementById('fase').textContent='🏆 Treino completo!';fala('Treino completo. Mandou bem!');return;}rep+=10;att();fala('Série '+rod+'. Dez pop-ups, vai!');tick(20,'Série '+rod+' — POP-UPS!',()=>descansa());}function descansa(){fala('Descanso');tick(30,'Descanso 😮‍💨',()=>{rod++;serie();});}function reset(){clearInterval(tm);fase=0;rep=0;rod=0;document.getElementById('fase').textContent='Pronta?';document.getElementById('t').textContent='00';att();}</script></body></html>
